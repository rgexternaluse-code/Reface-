<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="refaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <circle cx="256" cy="256" r="210" stroke="url(#refaceGrad)" stroke-width="8" opacity="0.4" />
  <circle cx="256" cy="256" r="180" fill="url(#refaceGrad)" opacity="0.12" />

  <!-- Reface Dual Swapping Face Icon -->
  <g transform="translate(136, 126)" filter="url(#glow)">
    <!-- Base Face Contour -->
    <path d="M120 20 C190 20 230 70 230 140 C230 210 180 250 120 250 C60 250 10 210 10 140 C10 70 50 20 120 20 Z" 
          stroke="url(#cyberGlow)" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Biometric Crosshair / Swap Arrows -->
    <path d="M60 110 Q90 90 120 110" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
    <path d="M180 110 Q150 90 120 110" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
    <circle cx="75" cy="115" r="10" fill="#38bdf8" />
    <circle cx="165" cy="115" r="10" fill="#818cf8" />
    <!-- Smile Arc -->
    <path d="M85 180 Q120 215 155 180" stroke="#ec4899" stroke-width="9" stroke-linecap="round" />
    <!-- Sparkle / Tech Node -->
    <circle cx="205" cy="55" r="7" fill="#ec4899" />
    <circle cx="35" cy="215" r="6" fill="#38bdf8" />
  </g>
</svg>
